[versions]
# ---- 构建工具链 ----
agp = "9.4.1"                    # https://developer.android.com/build/releases/gradle-plugin
kotlin = "2.3.20"                # https://kotlinlang.org/docs/releases.html
ksp = "2.3.12"                   # https://github.com/google/ksp/releases
# ---- AndroidX 基础 ----
coreKtx = "1.19.1"               # https://developer.android.com/jetpack/androidx/releases/core
lifecycle = "2.11.0"             # https://developer.android.com/jetpack/androidx/releases/lifecycle
activityCompose = "1.13.0"       # https://developer.android.com/jetpack/androidx/releases/activity
composeBom = "2026.09.00"        # https://developer.android.com/develop/ui/compose/bom/bom-mapping
navigationCompose = "2.10.2"     # https://developer.android.com/jetpack/androidx/releases/navigation
# ---- 依赖注入与持久化 ----
hilt = "2.60.1"                  # https://github.com/google/dagger/releases
hiltNavigationCompose = "1.4.0"  # https://developer.android.com/jetpack/androidx/releases/hilt
room = "2.8.5"                   # https://developer.android.com/jetpack/androidx/releases/room
datastore = "1.2.1"              # https://developer.android.com/jetpack/androidx/releases/datastore
sqlcipher = "4.19.1"             # https://github.com/sqlcipher/sqlcipher-android/releases
# ---- 桌面小组件 ----
glance = "1.2.0"                 # https://developer.android.com/jetpack/androidx/releases/glance
# ---- 网络与序列化 ----
okhttp = "5.5.0"                 # https://square.github.io/okhttp/changelogs/changelog/
retrofit = "3.0.0"               # https://github.com/square/retrofit/releases
kotlinxSerialization = "1.11.0"  # https://github.com/Kotlin/kotlinx.serialization/releases
coroutines = "1.11.0"            # https://github.com/Kotlin/kotlinx.coroutines/releases
# ---- 测试与性能验证 ----
junit = "4.13.2"                 # https://junit.org/junit4/
androidxTestJunit = "1.3.0"      # https://developer.android.com/jetpack/androidx/releases/test
espresso = "3.7.0"               # https://developer.android.com/jetpack/androidx/releases/test
uiautomator = "2.4.0"            # https://developer.android.com/jetpack/androidx/releases/test
benchmark = "1.5.0"              # https://developer.android.com/jetpack/androidx/releases/benchmark
baselineProfile = "1.5.0"        # https://developer.android.com/jetpack/androidx/releases/benchmark
profileInstaller = "1.4.1"       # https://developer.android.com/jetpack/androidx/releases/profileinstaller
metrics = "1.0.0"                # https://developer.android.com/jetpack/androidx/releases/metrics

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metrics" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
